<script src="{{BASIS}}marke.js"></script>
<!-- Thema und Modus sofort setzen, damit nichts aufblitzt -->
<script>
(function () {
  var h = document.documentElement, p = new URLSearchParams(location.search), m = window.MARKE || {};
  var k = 'deck:' + location.pathname + ':';
  var s = function (n) { try { return sessionStorage.getItem(k + n); } catch (e) { return null; } };
  var t = p.get('thema') || s('thema') || m.standardThema || 'editorial';
  var d = p.get('modus') || s('modus') || m.standardModus || 'hell';
  if (['editorial', 'bento', 'keynote'].indexOf(t) < 0) t = 'editorial';
  if (['hell', 'dunkel'].indexOf(d) < 0) d = 'hell';
  h.setAttribute('data-thema', t);
  h.setAttribute('data-modus', d);
  /* Markenfarben: Testfarbe (Farbwähler bzw. ?primaer=…) vor marke.js */
  var f = m.farben || {};
  ['primaer', 'sekundaer'].forEach(function (n) {
    var w = p.get(n) || s('farbe-' + n) || f[n] || '';
    if (/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(w)) w = '#' + w;
    if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(w)) h.style.setProperty('--marke-' + n, w);
  });
  if (p.has('referent')) h.classList.add('referent');
  if (p.has('druck')) h.classList.add('druckmodus');
  window.DECK_BASIS = '{{BASIS}}';
})();
</script>
